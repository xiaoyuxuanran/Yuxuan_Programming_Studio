<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>羽轩代码工作室</title><link rel="icon" href="brand.ico"><link rel="stylesheet" href="studio.css"></head>
<body>
<header class="topbar"><div class="identity"><img src="brand-logo.png" alt="羽轩 Logo"><div><strong>羽轩代码工作室</strong><span id="workspaceLabel">Python Workspace</span></div></div><div class="toolbar"><label class="sr-only" for="mode">编程语言</label><select id="mode"><option value="python">Python</option><option value="cpp">C++</option></select><label class="sr-only" for="pythonVersion">Python 版本</label><select id="pythonVersion"><option>3.13.16</option><option>3.8.9</option></select><div class="fontTools" role="group" aria-label="代码字体大小"><button id="fontSmaller" title="缩小字体 (Ctrl+-)" aria-label="缩小代码字体">A−</button><button id="fontReset" title="恢复默认字体 (Ctrl+0)" aria-label="恢复默认代码字号" aria-live="polite">14 px</button><button id="fontLarger" title="放大字体 (Ctrl++)" aria-label="放大代码字体">A+</button></div><button id="theme" class="subtle">☀ Light</button><button id="save" class="subtle" title="Ctrl+S">保存</button><button id="stop" class="stop" disabled>■ 停止</button><button id="run" class="primary" title="F5 / Ctrl+Enter">▶ 运行</button></div></header>
<div class="workbench">
<nav class="activity" aria-label="工作区面板"><button id="toggleSidebar" title="隐藏侧边栏 (Ctrl+B)" aria-label="隐藏侧边栏 (Ctrl+B)" aria-controls="sidebar" aria-expanded="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button><button id="filesPanel" class="active" title="项目文件" aria-label="项目文件">▤</button><button id="packagesPanel" title="Python 第三方库" aria-label="Python 第三方库">◈</button><div class="activityBottom">YX</div></nav>
<aside class="sidebar" id="sidebar"><section id="projectPanel"><div class="panelTitle"><h2>项目文件</h2><span id="projectCount"></span></div><label class="sr-only" for="project">选择项目</label><select id="project"></select><div class="projectActions"><button id="newProject">＋ 新建项目</button><button id="openProject">打开文件夹</button></div><div class="treeToolbar"><span id="projectTitle"></span><div><button id="newFile" title="新建文件" aria-label="新建文件">＋</button><button id="newFolder" title="新建文件夹" aria-label="新建文件夹">▣</button><button id="refresh" title="刷新文件树" aria-label="刷新文件树">↻</button></div></div><div id="tree" role="tree" aria-label="项目文件树"></div><div class="fileActions"><button id="renameFile">重命名</button><button id="trashFile">移入回收目录</button></div><p class="projectPath" id="projectPath"></p></section>
<section id="packagePanel" hidden><div class="panelTitle"><h2>Python 第三方库</h2><span>pip</span></div><p class="panelIntro">搜索库名，安装到当前项目和所选 Python 版本。</p><div class="packageSearch"><input id="packageQuery" placeholder="例如 requests、numpy" aria-label="搜索第三方库"><button id="searchPackage" class="primary">搜索</button></div><div class="chips"><button data-package="requests">requests</button><button data-package="numpy">numpy</button><button data-package="matplotlib">matplotlib</button><button data-package="pyserial">pyserial</button></div><div id="packageResult" class="packageResult"></div><div class="pipSource"><span class="dot"></span><strong>清华大学镜像源</strong><code>pypi.tuna.tsinghua.edu.cn/simple</code><p>安装需要网络。旧版 Python 会由 pip 选择兼容的库版本。</p></div></section></aside>
<main class="workspaceMain"><div class="tabsRow"><div id="tabs" role="tablist" aria-label="打开的文件"></div><span id="savedState">已保存</span></div><div id="editor"><div class="welcome"><div class="welcomeLogo">&lt;/&gt;</div><h1>从一行代码开始</h1><p>在左侧打开文件，或新建一个项目。</p><div><kbd>Ctrl+S</kbd> 保存　<kbd>F5</kbd> 运行　<kbd>Ctrl+Space</kbd> 提示</div></div></div><div class="consoleResize" id="consoleResize" role="separator" aria-label="调整运行结果高度" tabindex="0"></div><section class="console"><div class="consoleHeader"><div><strong>运行结果</strong><span id="runTitle">准备就绪</span></div><div><button id="clearOutput">清空输出</button><span id="runStatus"></span></div></div><pre id="output" role="log" aria-label="运行输出" aria-live="polite"></pre><form id="inputForm"><span>›</span><input id="stdin" placeholder="程序需要 input / cin 时，在这里输入并按回车" aria-label="程序输入" autocomplete="off"><button type="submit">发送</button></form></section></main>
</div><footer><span id="connection"><span class="dot"></span>本地工作区</span><span id="runtimeStatus">Python 3.13.16</span><span id="fileStatus">UTF-8</span><span id="position">行 1，列 1</span></footer>
<div id="toast" role="status" hidden></div>
<dialog id="promptDialog"><form method="dialog"><div class="dialogTitle"><h2 id="promptTitle">新建项目</h2><button value="cancel" class="subtle" aria-label="关闭对话框">×</button></div><p id="promptHint"></p><label for="promptValue" id="promptLabel">名称</label><input id="promptValue" required autocomplete="off"><div class="dialogActions"><button value="cancel" formnovalidate>取消</button><button value="ok" class="primary">确定</button></div></form></dialog>
<script src="vs/loader.js"></script><script src="studio.js"></script>
</body></html>
